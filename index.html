<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mario’s Theater Of Wonder</title>
  <link rel="stylesheet" href="style.css?v=5">
  <link rel="icon" type="image/png" href="content/websiteICON.png?v=5">
</head>
<body>

  <header>
    <img class="logo" src="content/mtow_logo.png" alt="Mario’s Theater Of Wonder">
  </header>

  <!-- Barra superior -->
  <nav class="topnav" id="topnav" aria-label="Main">
    <div class="topnav-inner">
      <a class="tab" href="#home" data-page="home">Home</a>
      <a class="tab" href="#downloads" data-page="downloads">Downloads</a>
      <a class="tab" href="#credits" data-page="credits">Credits</a>

      <a class="youtube" href="https://www.youtube.com/@xaggy726" target="_blank" rel="noopener">
        <svg viewBox="0 0 28 20" width="28" height="20" aria-hidden="true">
          <rect width="28" height="20" rx="5" fill="#ff0000"></rect>
          <path d="M11 5.5v9l8-4.5z" fill="#fff"></path>

        <span>xag’s channel</span>

      <div id="devlog-filters" class="devlog-filters"></div>
